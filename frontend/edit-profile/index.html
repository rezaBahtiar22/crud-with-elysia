<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profil — Heavenly</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>
  <div class="bg-grid"></div>

  <div class="theme-toggle" id="themeToggle" title="Ganti tema">
    <div class="theme-toggle-knob" id="themeKnob">🌙</div>
  </div>

  <div class="edit-wrapper">

    <!-- Top Bar -->
    <div class="top-bar">
      <button class="btn-back" id="btnBack">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 4L6 10l6 6"/>
        </svg>
        Kembali
      </button>
      <div class="top-brand">
        <div class="logo-mark">
          <span class="logo-mark-text">HL</span>
          <div class="logo-mark-ring"></div>
        </div>
        <div class="logo-text-wrap">
          <span class="logo-text">Heavenly</span>
          <span class="logo-subtext">Library</span>
        </div>
      </div>
    </div>

    <!-- Page Title -->
    <div class="page-title">
      <h1>Edit Profil</h1>
      <p>Perbarui informasi akun dan keamanan Anda</p>
    </div>

    <!-- Avatar Bar -->
    <div class="avatar-card">
      <div class="avatar-preview" id="avatarPreview">NC</div>
      <div class="avatar-info">
        <div class="avatar-name" id="avatarName">—</div>
        <div class="avatar-role" id="avatarRole">—</div>
      </div>
    </div>

    <!-- Two Column Grid -->
    <div class="edit-grid">

      <!-- KIRI: Informasi Profil -->
      <div class="edit-card">
        <div class="edit-card-header">
          <div class="edit-card-icon">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="10" cy="7" r="3"/>
              <path d="M3 18c0-3.3 3.1-6 7-6s7 2.7 7 6"/>
            </svg>
          </div>
          <div>
            <div class="edit-card-title">Informasi Profil</div>
            <div class="edit-card-sub">Perbarui nama dan email akun Anda</div>
          </div>
        </div>

        <form id="formUpdateProfile" novalidate>
          <div class="form-fields">

            <div class="field-group">
              <label class="field-label" for="upName">Nama Lengkap</label>
              <div class="field-wrap">
                <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                  <circle cx="10" cy="7" r="3"/>
                  <path d="M3 18c0-3.3 3.1-6 7-6s7 2.7 7 6"/>
                </svg>
                <input class="field-input" type="text" id="upName" placeholder="Nama lengkap" autocomplete="name" />
              </div>
              <span class="field-error" id="upNameErr"></span>
            </div>

            <div class="field-group">
              <label class="field-label" for="upEmail">Email</label>
              <div class="field-wrap">
                <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                  <rect x="2" y="5" width="16" height="12" rx="2"/>
                  <path d="M2 8l8 5 8-5"/>
                </svg>
                <input class="field-input" type="email" id="upEmail" placeholder="nama@email.com" autocomplete="email" />
              </div>
              <span class="field-error" id="upEmailErr"></span>
            </div>

          </div>

          <div class="form-footer">
            <span class="field-error form-error" id="upFormErr"></span>
            <div class="form-actions">
              <button type="button" class="btn-cancel" id="btnCancelProfile">Batal</button>
              <button type="submit" class="btn-save" id="btnSaveProfile">
                <span class="btn-text">Simpan Perubahan</span>
                <span class="btn-spinner" id="profileSpinner"></span>
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- KANAN: Keamanan Akun -->
      <div class="edit-card">
        <div class="edit-card-header">
          <div class="edit-card-icon edit-card-icon--security">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="4" y="9" width="12" height="9" rx="2"/>
              <path d="M7 9V6a3 3 0 0 1 6 0v3"/>
            </svg>
          </div>
          <div>
            <div class="edit-card-title">Keamanan Akun</div>
            <div class="edit-card-sub">Perbarui kata sandi untuk menjaga keamanan akun</div>
          </div>
        </div>

        <form id="formUpdatePassword" novalidate>
          <div class="form-fields">

            <div class="field-group">
              <label class="field-label" for="upCurrentPass">Kata Sandi Saat Ini</label>
              <div class="field-wrap">
                <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                  <rect x="4" y="9" width="12" height="9" rx="2"/>
                  <path d="M7 9V6a3 3 0 0 1 6 0v3"/>
                </svg>
                <input class="field-input" type="password" id="upCurrentPass" placeholder="Kata sandi saat ini" autocomplete="current-password" />
                <button type="button" class="toggle-pass" onclick="togglePass('upCurrentPass', this)" tabindex="-1">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/>
                    <circle cx="10" cy="10" r="2.5"/>
                  </svg>
                </button>
              </div>
              <span class="field-error" id="upCurrentPassErr"></span>
            </div>

            <div class="field-group">
              <label class="field-label" for="upNewPass">Kata Sandi Baru</label>
              <div class="field-wrap">
                <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                  <rect x="4" y="9" width="12" height="9" rx="2"/>
                  <path d="M7 9V6a3 3 0 0 1 6 0v3"/>
                </svg>
                <input class="field-input" type="password" id="upNewPass" placeholder="Min. 8 karakter" autocomplete="new-password" />
                <button type="button" class="toggle-pass" onclick="togglePass('upNewPass', this)" tabindex="-1">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/>
                    <circle cx="10" cy="10" r="2.5"/>
                  </svg>
                </button>
              </div>
              <span class="field-error" id="upNewPassErr"></span>
            </div>

            <div class="field-group">
              <label class="field-label" for="upConfirmPass">Konfirmasi Kata Sandi Baru</label>
              <div class="field-wrap">
                <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                  <rect x="4" y="9" width="12" height="9" rx="2"/>
                  <path d="M7 9V6a3 3 0 0 1 6 0v3"/>
                </svg>
                <input class="field-input" type="password" id="upConfirmPass" placeholder="Ulangi kata sandi baru" autocomplete="new-password" />
                <button type="button" class="toggle-pass" onclick="togglePass('upConfirmPass', this)" tabindex="-1">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/>
                    <circle cx="10" cy="10" r="2.5"/>
                  </svg>
                </button>
              </div>
              <span class="field-error" id="upConfirmPassErr"></span>
            </div>

          </div>

          <div class="form-footer">
            <span class="field-error form-error" id="upPassFormErr"></span>
            <div class="form-actions">
              <button type="button" class="btn-cancel" id="btnCancelPassword">Batal</button>
              <button type="submit" class="btn-save btn-save--security" id="btnSavePassword">
                <span class="btn-text">Perbarui Kata Sandi</span>
                <span class="btn-spinner" id="passwordSpinner"></span>
              </button>
            </div>
          </div>
        </form>
      </div>

    </div>

    <p class="edit-footer">© 2026 Heavenly · Semua hak dilindungi</p>

  </div>

  <!-- SUCCESS TOAST -->
  <div class="toast" id="toast">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M4 10l4 4 8-8"/>
    </svg>
    <span id="toastMsg">Berhasil disimpan!</span>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="script.js"></script>

</body>
</html>
