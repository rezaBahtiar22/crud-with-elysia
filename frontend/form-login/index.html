<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Login dulu dek</title>
</head>
<body>

  <!-- Background decoration -->
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>
  <div class="bg-grid"></div>

  <!-- Theme Toggle -->
  <div class="theme-toggle" id="themeToggle" title="Ganti tema">
    <div class="theme-toggle-knob" id="themeKnob">🌙</div>
  </div>

  <!-- Page Layout: Left branding + Right form -->
  <div class="page-layout">

    <!-- LEFT PANEL -->
    <div class="left-panel">
      <div class="brand">
        <div class="logo-mark">
          <span class="logo-mark-text">HL</span>
          <div class="logo-mark-ring"></div>
        </div>
        <div class="logo-text-wrap">
          <span class="logo-text">Heavenly</span>
          <span class="logo-subtext">Library</span>
        </div>
      </div>
      <div class="brand-body">
        <h2 class="brand-headline">Platform Perpustakaan terbaik<br/>untuk adek".</h2>
        <p class="brand-desc">Kelola buku dari berbagai zaman.</p>
        <div class="brand-features">
          <div class="feature-item">
            <span class="feature-dot"></span>Login
          </div>
          <div class="feature-item">
            <span class="feature-dot"></span>Daily
          </div>
          <div class="feature-item">
            <span class="feature-dot"></span>Turu
          </div>
        </div>
      </div>
      <p class="left-footer">© 2026 Heavenly Library</p>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <div class="auth-card" id="authCard">

        <!-- Tab Switcher -->
        <div class="tab-bar">
          <button class="tab active" id="tabSignIn" onclick="switchTab('signin')">Masuk</button>
          <button class="tab" id="tabSignUp" onclick="switchTab('signup')">Daftar</button>
          <div class="tab-indicator" id="tabIndicator"></div>
        </div>

        <!-- ── SIGN IN ── -->
        <div class="form-panel" id="panelSignIn">
          <div class="form-header">
            <h1 class="form-title">Selamat datang kembali</h1>
            <p class="form-sub">Masuk ke akun Anda</p>
          </div>

          <form class="form" id="formSignIn" novalidate>
            <div class="field-row">
              <div class="field-group">
                <label class="field-label" for="siEmail">Email</label>
                <div class="field-wrap">
                  <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                    <rect x="2" y="5" width="16" height="12" rx="2"/>
                    <path d="M2 8l8 5 8-5"/>
                  </svg>
                  <input class="field-input" type="email" id="siEmail" placeholder="nama@email.com" autocomplete="email" />
                </div>
                <span class="field-error" id="siEmailErr"></span>
              </div>

              <div class="field-group">
                <label class="field-label" for="siPassword">
                  Kata Sandi
                  <a href="#" class="forgot-link">Lupa?</a>
                </label>
                <div class="field-wrap">
                  <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                    <rect x="4" y="9" width="12" height="9" rx="2"/>
                    <path d="M7 9V6a3 3 0 0 1 6 0v3"/>
                  </svg>
                  <input class="field-input" type="password" id="siPassword" placeholder="••••••••" autocomplete="current-password" />
                  <button type="button" class="toggle-pass" onclick="togglePass('siPassword', this)" tabindex="-1">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                      <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/>
                      <circle cx="10" cy="10" r="2.5"/>
                    </svg>
                  </button>
                </div>
                <span class="field-error" id="siPassErr"></span>
              </div>
            </div>

            <div class="form-actions-row">
              <label class="checkbox-label">
                <input type="checkbox" id="siRemember" />
                <span class="checkbox-custom"></span>
                Ingat saya
              </label>
              <button type="submit" class="btn-submit" id="btnSignIn">
                <span class="btn-text">Masuk</span>
                <span class="btn-spinner" id="siSpinner"></span>
              </button>
            </div>
          </form>

          <div class="divider"><span>atau lanjutkan dengan</span></div>

          <div class="social-row">
            <button class="btn-social">
              <svg viewBox="0 0 24 24" width="16" height="16">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              Google
            </button>
            <button class="btn-social">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
              </svg>
              GitHub
            </button>
          </div>
        </div>

        <!-- ── SIGN UP ── -->
        <div class="form-panel hidden" id="panelSignUp">
          <div class="form-header">
            <h1 class="form-title">Buat akun baru</h1>
            <p class="form-sub">Bergabung sekarang</p>
          </div>

          <form class="form" id="formSignUp" novalidate>

            <!-- Row 1: Nama Depan + Nama Belakang -->
            <div class="field-row">
              <div class="field-group">
                <label class="field-label" for="suNama">Nama Depan</label>
                <div class="field-wrap">
                  <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                    <circle cx="10" cy="7" r="3"/>
                    <path d="M3 18c0-3.3 3.1-6 7-6s7 2.7 7 6"/>
                  </svg>
                  <input class="field-input" type="text" id="suNama" placeholder="Nana" autocomplete="given-name" />
                </div>
                <span class="field-error" id="suNamaErr"></span>
              </div>
              <div class="field-group">
                <label class="field-label" for="suLastname">Nama Belakang</label>
                <div class="field-wrap">
                  <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                    <circle cx="10" cy="7" r="3"/>
                    <path d="M3 18c0-3.3 3.1-6 7-6s7 2.7 7 6"/>
                  </svg>
                  <input class="field-input" type="text" id="suLastname" placeholder="Cute" autocomplete="family-name" />
                </div>
              </div>
            </div>

            <!-- Row 2: Email + Password -->
            <div class="field-row">
              <div class="field-group">
                <label class="field-label" for="suEmail">Email</label>
                <div class="field-wrap">
                  <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                    <rect x="2" y="5" width="16" height="12" rx="2"/>
                    <path d="M2 8l8 5 8-5"/>
                  </svg>
                  <input class="field-input" type="email" id="suEmail" placeholder="nama@email.com" autocomplete="email" />
                </div>
                <span class="field-error" id="suEmailErr"></span>
              </div>
              <div class="field-group">
                <label class="field-label" for="suPassword">Kata Sandi</label>
                <div class="field-wrap">
                  <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                    <rect x="4" y="9" width="12" height="9" rx="2"/>
                    <path d="M7 9V6a3 3 0 0 1 6 0v3"/>
                  </svg>
                  <input class="field-input" type="password" id="suPassword" placeholder="Min. 8 karakter" autocomplete="new-password" />
                  <button type="button" class="toggle-pass" onclick="togglePass('suPassword', this)" tabindex="-1">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                      <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/>
                      <circle cx="10" cy="10" r="2.5"/>
                    </svg>
                  </button>
                </div>
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <span class="strength-label" id="strengthLabel"></span>
                <span class="field-error" id="suPassErr"></span>
              </div>
            </div>

            <!-- Row 3: Konfirmasi Password -->
            <div class="field-group">
              <label class="field-label" for="suConfirm">Konfirmasi Kata Sandi</label>
              <div class="field-wrap">
                <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                  <rect x="4" y="9" width="12" height="9" rx="2"/>
                  <path d="M7 9V6a3 3 0 0 1 6 0v3"/>
                </svg>
                <input class="field-input" type="password" id="suConfirm" placeholder="Ulangi kata sandi" autocomplete="new-password" />
                <button type="button" class="toggle-pass" onclick="togglePass('suConfirm', this)" tabindex="-1">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/>
                    <circle cx="10" cy="10" r="2.5"/>
                  </svg>
                </button>
              </div>
              <span class="field-error" id="suConfirmErr"></span>
            </div>

            <!-- Row 4: Terms + Submit -->
            <div class="form-actions-row">
              <label class="checkbox-label terms">
                <input type="checkbox" id="suTerms" />
                <span class="checkbox-custom"></span>
                Setuju dengan <a href="#">Syarat</a> &amp; <a href="#">Privasi</a>
              </label>
              <button type="submit" class="btn-submit" id="btnSignUp">
                <span class="btn-text">Buat Akun</span>
                <span class="btn-spinner" id="suSpinner"></span>
              </button>
            </div>
            <span class="field-error" id="suTermsErr"></span>

          </form>
        </div>

      </div>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
