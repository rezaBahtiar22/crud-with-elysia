<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil Saya — Heavenly</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background decoration -->
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>
  <div class="bg-grid"></div>

  <!-- Theme Toggle -->
  <div class="theme-toggle" id="themeToggle" title="Ganti tema">
    <div class="theme-toggle-knob" id="themeKnob">🌙</div>
  </div>

  <!-- Page Wrapper -->
  <div class="profile-wrapper">

    <!-- Top Bar -->
    <div class="top-bar">
      <button class="btn-back" id="btnBack">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 4L6 10l6 6"/>
        </svg>
        Kembali ke Dashboard
      </button>
      <div class="top-brand">
        <div class="logo-mark">
          <span class="logo-mark-text">HL</span>
          <div class="logo-mark-ring"></div>
        </div>
        <div class="logo-text-wrap">
          <span class="logo-text">Heavenly</span>
          <span class="logo-subtext">Library</span>
        </div>
      </div>
    </div>

    <!-- Profile Card -->
    <div class="profile-container">

      <!-- Hero Section -->
      <div class="profile-hero">
        <div class="hero-bg-accent"></div>

        <div class="avatar-wrapper" id="avatarWrapper" title="Klik untuk ganti foto (segera hadir)">
          <div class="avatar-circle" id="avatarCircle">NC</div>
          <div class="avatar-overlay">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
            <span>Ganti Foto</span>
          </div>
          <div class="avatar-coming-soon" id="avatarComingSoon">
            <span>🚧 Segera Hadir</span>
          </div>
        </div>

        <div class="hero-info">
          <h1 class="hero-name" id="heroName">—</h1>
          <p class="hero-email" id="heroEmail">—</p>
          <span class="hero-role-badge" id="heroRole">—</span>
        </div>

        <button class="btn-edit-profile" id="btnEditProfile">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M14.5 2.5a2 2 0 0 1 3 3L10 13H7v-3L14.5 2.5z"/>
          </svg>
          Edit Profil
        </button>
      </div>

      <!-- Info Grid -->
      <div class="info-grid">

        <div class="info-card">
          <div class="info-card-icon">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="10" cy="7" r="3"/>
              <path d="M3 18c0-3.3 3.1-6 7-6s7 2.7 7 6"/>
            </svg>
          </div>
          <div class="info-card-body">
            <div class="info-card-label">Nama Lengkap</div>
            <div class="info-card-value" id="infoName">—</div>
          </div>
        </div>

        <div class="info-card">
          <div class="info-card-icon">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="2" y="5" width="16" height="12" rx="2"/>
              <path d="M2 8l8 5 8-5"/>
            </svg>
          </div>
          <div class="info-card-body">
            <div class="info-card-label">Email</div>
            <div class="info-card-value" id="infoEmail">—</div>
          </div>
        </div>

        <div class="info-card">
          <div class="info-card-icon accent-icon">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M10 2l2.4 4.8 5.3.8-3.8 3.7.9 5.3L10 14l-4.8 2.6.9-5.3L2.3 7.6l5.3-.8z"/>
            </svg>
          </div>
          <div class="info-card-body">
            <div class="info-card-label">Role</div>
            <div class="info-card-value accent-value" id="infoRole">—</div>
          </div>
        </div>

        <div class="info-card">
          <div class="info-card-icon">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="3" y="4" width="14" height="13" rx="2"/>
              <path d="M3 8h14M8 4V2M12 4V2"/>
            </svg>
          </div>
          <div class="info-card-body">
            <div class="info-card-label">Akun Dibuat</div>
            <div class="info-card-value" id="infoCreatedAt">—</div>
          </div>
        </div>

      </div>

      <!-- Action Buttons -->
      <div class="action-list">

        <div class="action-section-label">Keamanan Akun</div>

        <button class="action-btn" id="btnChangePassword">
          <div class="action-btn-icon">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="4" y="9" width="12" height="9" rx="2"/>
              <path d="M7 9V6a3 3 0 0 1 6 0v3"/>
            </svg>
          </div>
          <div class="action-btn-body">
            <span class="action-btn-title">Ganti Kata Sandi</span>
            <span class="action-btn-sub">Perbarui kata sandi akun Anda</span>
          </div>
          <svg class="action-btn-arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M7 4l6 6-6 6"/>
          </svg>
        </button>

        <div class="action-section-label" style="margin-top: 8px;">Sesi</div>
          <button class="action-btn action-btn--danger" id="btnLogout">
            <div class="action-btn-icon action-btn-icon--danger">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M13 3h3a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-3M8 14l-4-4 4-4M3 10h9"/>
              </svg>
            </div>
            <div class="action-btn-body">
              <span class="action-btn-title">Keluar</span>
              <span class="action-btn-sub">Akhiri sesi dan keluar dari akun</span>
            </div>
            <svg class="action-btn-arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M7 4l6 6-6 6"/>
            </svg>
          </button>
        </button>

        <!-- LOGOUT MODAL -->
        <div class="modal-overlay" id="logoutOverlay">
          <div class="modal-box">
            <div class="modal-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                <polyline points="10 17 15 12 10 7"/>
                <line x1="15" y1="12" x2="3" y2="12"/>
              </svg>
            </div>
            <h2 class="modal-title">Yakin ingin keluar?</h2>
            <p class="modal-desc">Sesi Anda akan diakhiri. Tekan Ya untuk keluar.</p>
            <div class="modal-actions">
              <button class="modal-btn modal-btn--cancel" id="logoutCancel">Batal</button>
              <button class="modal-btn modal-btn--confirm" id="logoutConfirm">Ya, Keluar</button>
            </div>
          </div>
        </div>

      </div>

    </div>

    <p class="profile-footer">© 2026 Heavenly · Semua hak dilindungi</p>

  </div>

  <script src="script.js"></script>
</body>
</html>
